services:
  api:
    image: billing-backend:1.0
    container_name: billing-backend
    restart: unless-stopped
    ports:
      - "5000:8080"
    # All secrets MUST come from environment / Docker secrets / Key Vault.
    # Copy .env.example to .env locally (never commit .env). In production inject via vault.
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # Required (no defaults — container fails fast if missing):
      # - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      # - Jwt__Key=${Jwt__Key}
      # - Security__TokenEncryptionKey=${Security__TokenEncryptionKey}
      # - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      # - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      # - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
    # Oracle wallet is mounted read-only at runtime, never baked into the image:
    # volumes:
    #   - ./wallet:/app/wallet:ro
